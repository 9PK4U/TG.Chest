server {
    listen 80;
    server_name chest.pk4u.ru;
    return 308 https://chest.pk4u.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name chest.pk4u.ru;
    include /etc/nginx/snippets/tls.conf;
    client_max_body_size 25m;

    location / {
        set $chest_backend chest-api:8000;
        proxy_pass http://$chest_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
